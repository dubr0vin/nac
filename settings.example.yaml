# Tags are personal. The ics: prefix belongs to imported categories.
tags: [работа, личное, созвон]

default_tags:
  created: [личное]
  invited: [созвон]

# Conditions: true, false, {tag: name}, {not: condition},
# {and: [conditions]}, {or: [conditions]}.
busy:
  and:
    - tag: работа
    - not:
        tag: личное

# Colors: dark, gray (grey), red, pink, grape, violet, indigo, blue,
# cyan, teal, green, lime, yellow, orange — Mantine shade 6. HEX also works.
# First match wins. A pair of colors draws diagonal stripes.
# Keep a final when: true rule as the default color.
colors:
  - when: {tag: созвон}
    color: [blue, orange]
  - when: {tag: работа}
    color: blue
  - when: true
    color: teal
